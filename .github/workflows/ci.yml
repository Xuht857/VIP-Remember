name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # 锁定与本地开发一致的稳定版，避免 CI 拉到不同 minor 导致行为漂移
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee /tmp/flutter_build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把关键错误行写成 check-run 注解。公开仓库的注解可匿名读取，
            # 这样即使没有 PAT 下载 job 日志，也能自动获取失败原因。
            echo "::error title=Build debug APK failed::exit_code=$code"
            grep -nE 'FAILURE:|What went wrong|Script compilation|error:|Unresolved|Cannot run|BUILD FAILED|Execution failed|SDK location|Could not resolve|Error:' /tmp/flutter_build.log \
              | head -40 \
              | while IFS= read -r line; do
                  line=${line//%/%25}
                  line=${line//$'\r'/%0D}
                  line=${line//$'\n'/%0A}
                  echo "::error::${line:0:900}"
                done
            exit "$code"
          fi

      # P0-1 验收断言：两个 receiver 必须真实进入 APK 的合并后 Manifest
      - name: Assert notification receivers present in APK manifest
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -n 1 || ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest_tree.txt
          grep -qi "ScheduledNotificationReceiver" manifest_tree.txt \
            || { echo "FAIL: ScheduledNotificationReceiver missing"; exit 1; }
          grep -qi "ScheduledNotificationBootReceiver" manifest_tree.txt \
            || { echo "FAIL: ScheduledNotificationBootReceiver missing"; exit 1; }
          echo "PASS: both receivers present in APK manifest"

      # P0-2 验收断言：desugaring 配置存在；minSdk<26 时断言 dex 中含 desugar 后的 java.time（j$/time）
      - name: Assert core library desugaring
        run: |
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts \
            || { echo "FAIL: coreLibraryDesugaringEnabled not set"; exit 1; }
          grep -q 'desugar_jdk_libs' android/app/build.gradle.kts \
            || { echo "FAIL: desugar_jdk_libs dependency missing"; exit 1; }
          APK=build/app/outputs/flutter-apk/app-debug.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -n 1 || ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          MINSDK=$("$AAPT" dump badging "$APK" | grep sdkVersion | head -1 | sed "s/.*sdkVersion:'\([0-9]*\)'.*/\1/")
          echo "minSdk=$MINSDK"
          if [ "$MINSDK" -lt 26 ]; then
            unzip -p "$APK" 'classes*.dex' | grep -a -F -q 'j$/time' \
              || { echo "FAIL: desugared java.time classes not in dex"; exit 1; }
            echo "PASS: desugared java.time classes present in dex"
          else
            echo "minSdk>=26, dex rewrite not expected; config assertion suffices"
          fi
